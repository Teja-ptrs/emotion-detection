services:
  - type: web
    name: emotion-ai-system
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MODEL_PATH
        value: models/emotion_model.keras
      - key: DATABASE_URL
        value: sqlite:///./emotion_ai.db
      - key: CORS_ORIGINS
        value: "*"
