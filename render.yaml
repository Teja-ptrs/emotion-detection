services:
  - type: web
    name: emotion-ai-system
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && npm --prefix frontend install && npm --prefix frontend run build"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MODEL_PATH
        value: models/emotion_model.keras
      - key: DATABASE_URL
        value: sqlite:///./emotion_ai.db
      - key: CORS_ORIGINS
        value: "*"
